import com.modrinth.minotaur.dependencies.ModDependency

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.10.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven { url "https://maven.blamejared.com/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fairylights" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-item:${project.cca_version}"

	include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	include "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}"
	include "org.ladysnake.cardinal-components-api:cardinal-components-item:${project.cca_version}"

	compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") { transitive = false }
	if (project.enable_jei.toBoolean()) {
		implementation("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") { transitive = false }
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

modrinth {
	token = '<PAT>';
	projectId = 'OuLVx5LM' // The ID of your Modrinth project. Slugs will not work.
	uploadFile = jar // Tells Minotaur to use the built jar
	gameVersions = ['26.1.2'] // An array of game versions the version supports
	loaders = ['fabric'] // Self-explanatory.
	dependencies = [
			new ModDependency('P7dR8mSH', 'required') // Creates a new required dependency on Fabric API
	]
}
